<!DOCTYPE html>
<html lang="en">
<head>

    <title>Demo</title>
</head>
<body>
<h1>Course registration</h1>

<form action="Thanks.html">
    
    <fieldset>
    
        <legend>Personal Details </legend>

    <table>
        <tr>
            <td><label>First name</label></td>
            <td><input type="text" name="First name"  placeholder="Ex:-Ash" required size="10"></td>
        </tr>  
        <tr>
            <td><label>Surname</label></td>
            <td><input type="text" name="Surname" placeholder="Ex:-Reddy" required size="10"></td>
        </tr> 
        <tr>
            <td><label>Mobile Number</label></td>
            <td><input type="tel" name="Mobile" placeholder="Ex:-123456789" required size="10"></td>
        </tr>
        <tr>
            <td><label>E-mail</label></td>
            <td><input type="email" name="email" placeholder="Ex:-abc@gmail.com" required size="10"></td>
        </tr>        
        <tr>
            <td><label>password</label></td>
            <td><input type="password" name="password" size="10" required></td>
        </tr>    
        <tr>
            <td><label>Confirm Password</label></td>
            <td><input type="password" name="password" size="10" required></td>
        </tr>
        <tr>
            <td><label>DOB</label></td>
            <td><input type="date" name="date" required size="10"></td>
        </tr>
        <tr>
            <td><label>Gender</label></td>
            <td><input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female
            <input type="radio" name="Gender">Other</td>
        </tr>
        <tr>
            <td><label>Select Country</label></td>
            <td>
                <select name="Country">
            <option>--Select Country--</option>
            <option>INDIA</option>
            <option>USA</option>
            <option>RUSSIA</option>
                </select>
    </td>
        </tr>
        <tr>
            <td><label>Upload File</label></td>
            <td><input type="file" name="file"></td>
        </tr>
        <tr>
            <td><label>Privacy Policy</label></td>
            <td><input type="checkbox"></td>
        </tr>
        <tr>
            <td><label>Feedback</label></td>
            <td><input type="text" required size="200"></td>
        </tr>
        <tr>
            <td><input type="reset" name="reset"></td>
        </tr>
        <tr>
            <td><input type="submit" name="submit"></td>
        </tr>                
    
    </table><br>
    <label>Comment:-</label>
            <input type="text" size="200">

    </fieldset>

</form>

</body>
</html>
