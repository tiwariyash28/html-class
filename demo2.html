<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Validated user input form </title>
<script>
    function validateform(){
const name=document.getElementById('name').value.trim();
const password=document.getElementById('password').value;
const age=parseInt(document.getElementById('age').value,10);
const gender=document.getElementsByName('gender');
        let genderSelected=false;

	if(name===""){
        alert("Please enter your name");
        return false;
    }
    if(password===""){
        alert("Please enter your password");
        return false;
    }
    if(isNaN(age)||age<1||age>150){
        alert("Age must be a number between 1 and 150.");
        return false
    }
    for(let i=0;i<gender.length;i++){
        if (gender[i].checked){
            genderSelected=true;
            break;
        }
    }
    if(!genderSelected){
        alert("Please select your gender");
        return false;
    }
    //All validations passed

return true;
}
</script>
</head>
<body>
<h2>User Information Form with Validation</h2>
<form action="/submit" method="post" onsubmit="return validateForm()">
    <label for="name">Name:</label><br />
    <input type="text" id="name" name="name" /><br/><br/>
    <label for="password">Password:</label><br />
    <input type="password" id="password" name="password" /><br /><br />
    <label for="age">Age:</label><br />
    <input type="number" id="age" name="age" /><br/><br/>
    <label for="address">Address:</label><br />
    <textarea id="address" name="address" rows="3" cols="30"></textarea><br /><br/>
    <label>Gender:</label><br/>
    <input type="radio" id="male" name="gender" value="male" />
    <label for="male">Male</label><br />
    <input type="radio" id="female" name="gender" value="female" />
    <label for="female">Female</label><br />
    <input type="radio" id="other" name="gender" value="other" />
    <label for="other">Other</label><br /><br />
    <label>Hobbies:</label><br />
    <input type="checkbox" id="reading" name="hobbies" value="Reading" />
    <label for="reading">Reading</label><br />
    <input type="checkbox" id="traveling" name="hobbies" value="Traveling" />
    <label for="traveling">Traveling</label><br />
    <input type="checkbox" id="sports" name="hobbies" value="Sports" />
    <label for="sports">Sports</label><br /><br />
    <label for="subject">Favorite Subject:</label><br />
    <input type="text" id="subject" name="subject" /><br /><br />
    <label for="movie">Favorite Movie:</label><br />
    <input type="text" id="movie" name="movie" /><br /><br />
    <label for="singer">Favorite Singer:</label><br />
    <input type="text" id="singer" name="singer" /><br /><br />
    <input type="submit" value="Submit" />
</form>
</body>
</html>
