<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Background colour After 5 seconds</title>
    <script>
        //function to run after page loads
        window.onload=function(){
            setTimeout(function(){
                document.body.style.backgroundColor="lightblue";
                console.log("Background color changed after 5 seconds");
            },5000);
        };
    </script>
</head>
<body>
    <h1>Welcome to My Web Page</h1>
    <p>The background color will change 5 seconds after the page loads</p> 
</body>
</html>
