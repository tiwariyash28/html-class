<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    function modifyArray(arr){
        arr.push(40);
        document.write("Inside function,array=",arr)
    }
    let numbers = [10 , 20 , 30] 
    document.write("Before function call,numbers=",numbers) 
    modifyArray(numbers);
    document.write("After function call,array=",numbers)

</body>
</html>
