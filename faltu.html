<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM Basic Example</title>
</head>
<body>
    <h1>Document Object Model</h1>
    <p>This is a simple DOM tree example.</p>
    <script>
        document.write("<b>Document Title:</b> " + document.title + "<br>");
        document.write("<b>Document Elements:</b> " + document.documentElement.nodeName + "<br>");
        document.write("<b>Body Node:</b> " + document.body.nodeName + "<br>");
    </script>
</body>
</html>
